server {
    listen 80;
    server_name _;

    # Tout le trafic client-serveur doit passer par TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificat monté en lecture seule depuis un volume externe au conteneur
    # (voir docker-compose.yml : ./certs). Non fourni ici, à déployer par
    # l'hébergeur (ex. Let's Encrypt / certbot, ou certificat interne).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Photos chiffrées jusqu'à 20 Mo (voir CLAUDE.md), avec un peu de marge pour les
    # en-têtes HTTP.
    client_max_body_size 21m;

    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
